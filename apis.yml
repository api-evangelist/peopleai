name: People.ai
description: >-
  People.ai is an AI-powered revenue intelligence platform for enterprise sales
  teams. It automatically captures sales activity and contact data from email,
  calendar, and meetings, matches it into CRM systems like Salesforce and
  Microsoft Dynamics 365, and delivers AI-driven forecasting, opportunity
  management, account execution, and engagement forensics to improve pipeline
  visibility and drive predictable revenue growth. People.ai integrates with
  Salesforce, Microsoft, Oracle, Slack, Zoom, Webex, 6sense, and ZoomInfo. It
  is delivered as an enterprise SaaS product and does not publish a public
  developer API; its trust and security posture is documented with SOC 2, ISO
  27001, ISO 27017, GDPR, and CSA STAR. As of 2026 People.ai has rebranded to
  Backstory (www.people.ai now 301-redirects to www.backstory.ai); the product
  login remains at app.people.ai.
